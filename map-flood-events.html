<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Large Flood Events (1985–2024)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Segoe UI', sans-serif; background: #0f172a; }

    header {
      position: absolute; top: 0; left: 0; right: 0; height: 52px;
      z-index: 1000; background: #0f172a; color: #fff;
      padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: baseline; gap: 12px; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    header p  { font-size: 0.78rem; color: #94a3b8; }
    #event-count { font-size: 0.78rem; color: #94a3b8; }

    #map { position: absolute; top: 52px; bottom: 0; left: 0; right: 0; }

    /* Controls */
    #controls {
      position: absolute; top: 62px; left: 10px; z-index: 1000;
      background: rgba(15,23,42,0.92); color: #e2e8f0;
      border-radius: 8px; padding: 12px 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      font-size: 0.78rem; min-width: 200px;
    }
    #controls h4 { font-size: 0.82rem; color: #38bdf8; margin-bottom: 10px; }
    .ctrl-group { margin-bottom: 10px; }
    .ctrl-group label { display: block; margin-bottom: 3px; color: #94a3b8; }
    .ctrl-group input[type=range] { width: 100%; accent-color: #38bdf8; }
    .ctrl-group select {
      width: 100%; background: #1e293b; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 4px; padding: 3px 6px;
    }
    .range-labels { display: flex; justify-content: space-between; color: #64748b; font-size: 0.72rem; }
    .sev-btns { display: flex; gap: 4px; }
    .sev-btn {
      flex: 1; padding: 4px 0; border: none; border-radius: 4px;
      cursor: pointer; font-size: 0.75rem; font-weight: 600; color: #fff;
      opacity: 0.45; transition: opacity 0.15s;
    }
    .sev-btn.active { opacity: 1; }
    .sev-btn.s1   { background: #f59e0b; }
    .sev-btn.s15  { background: #f97316; }
    .sev-btn.s2   { background: #dc2626; }

    /* Legend */
    #legend {
      position: absolute; bottom: 28px; left: 10px; z-index: 1000;
      background: rgba(15,23,42,0.92); color: #e2e8f0;
      border-radius: 8px; padding: 10px 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4); font-size: 0.76rem;
    }
    #legend h4 { color: #38bdf8; margin-bottom: 6px; font-size: 0.8rem; }
    .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; opacity: 0.85; }

    /* Loading */
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 2000; color: #38bdf8; font-size: 1rem; text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Global Large Flood Events</h1>
    <p>Dartmouth Flood Observatory · 1985–2024</p>
  </div>
  <span id="event-count">Loading...</span>
</header>

<div id="map"></div>
<div id="loading">Loading flood data...</div>

<div id="controls">
  <h4>Filters</h4>
  <div class="ctrl-group">
    <label>Year: <strong id="year-val">All</strong></label>
    <input type="range" id="year-slider" min="1985" max="2024" step="1" value="0" />
    <div class="range-labels"><span>1985</span><span>All</span><span>2024</span></div>
  </div>
  <div class="ctrl-group">
    <label>Severity</label>
    <div class="sev-btns">
      <button class="sev-btn s1 active"  data-sev="1">1 — Low</button>
      <button class="sev-btn s15 active" data-sev="1.5">1.5 — Med</button>
      <button class="sev-btn s2 active"  data-sev="2">2 — High</button>
    </div>
  </div>
  <div class="ctrl-group">
    <label>Cause</label>
    <select id="cause-filter"><option value="">All causes</option></select>
  </div>
</div>

<div id="legend">
  <h4>Severity</h4>
  <div class="leg-row"><div class="leg-dot" style="background:#f59e0b"></div> 1 — Moderate</div>
  <div class="leg-row"><div class="leg-dot" style="background:#f97316"></div> 1.5 — Significant</div>
  <div class="leg-row"><div class="leg-dot" style="background:#dc2626"></div> 2 — Large / Extreme</div>
  <div style="margin-top:8px; color:#64748b; font-size:0.71rem;">Circle size = deaths</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  var map = L.map('map', { center: [20, 10], zoom: 2 });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(map);

  var SEV_COLOR = { '1': '#f59e0b', '1.5': '#f97316', '2': '#dc2626' };

  function deathRadius(d) {
    var n = parseInt(d) || 0;
    if (n === 0)   return 4;
    if (n < 10)    return 5;
    if (n < 50)    return 7;
    if (n < 200)   return 9;
    if (n < 1000)  return 12;
    if (n < 5000)  return 16;
    return 20;
  }

  var allData = [];
  var clusterGroup = null;

  // Active filter state
  var filterYear = 0;       // 0 = all
  var filterSev  = { '1': true, '1.5': true, '2': true };
  var filterCause = '';

  function buildMarkers() {
    if (clusterGroup) map.removeLayer(clusterGroup);

    clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 40,
      chunkedLoading: true,
      iconCreateFunction: function(cluster) {
        var n = cluster.getChildCount();
        var sz = n < 50 ? 32 : n < 200 ? 40 : 50;
        return L.divIcon({
          html: '<div style="background:rgba(56,189,248,0.75);width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:#0f172a;border:2px solid rgba(56,189,248,0.4)">' + n + '</div>',
          className: '', iconSize: [sz, sz]
        });
      }
    });

    var shown = 0;
    allData.forEach(function(e) {
      if (filterYear && e.began.slice(0,4) !== String(filterYear)) return;
      if (!filterSev[e.sev]) return;
      if (filterCause && e.cause !== filterCause) return;

      var color = SEV_COLOR[e.sev] || '#f59e0b';
      var marker = L.circleMarker([e.lat, e.lon], {
        radius: deathRadius(e.dead),
        fillColor: color,
        color: 'rgba(255,255,255,0.3)',
        weight: 1,
        fillOpacity: 0.8
      });

      var dead = parseInt(e.dead) || 0;
      var disp = parseInt(e.disp) || 0;
      marker.bindPopup(
        '<div style="min-width:180px">' +
        '<strong style="color:' + color + ';font-size:0.95rem">' + e.country + '</strong>' +
        '<div style="color:#555;font-size:0.78rem;margin:2px 0">' + e.began + ' → ' + e.ended + '</div>' +
        '<hr style="border:none;border-top:1px solid #eee;margin:5px 0"/>' +
        '<table style="width:100%;font-size:0.8rem;border-collapse:collapse">' +
        '<tr><td style="color:#888;padding:1px 6px 1px 0">Cause</td><td>' + (e.cause||'—') + '</td></tr>' +
        '<tr><td style="color:#888;padding:1px 6px 1px 0">Severity</td><td>' + e.sev + '</td></tr>' +
        '<tr><td style="color:#888;padding:1px 6px 1px 0">Deaths</td><td>' + (dead > 0 ? dead.toLocaleString() : '0') + '</td></tr>' +
        '<tr><td style="color:#888;padding:1px 6px 1px 0">Displaced</td><td>' + (disp > 0 ? disp.toLocaleString() : '0') + '</td></tr>' +
        '</table></div>',
        { maxWidth: 240 }
      );
      clusterGroup.addLayer(marker);
      shown++;
    });

    map.addLayer(clusterGroup);
    document.getElementById('event-count').textContent = shown.toLocaleString() + ' events shown';
  }

  // Year slider
  var slider = document.getElementById('year-slider');
  var yearVal = document.getElementById('year-val');
  slider.addEventListener('input', function() {
    var v = parseInt(this.value);
    // Use max value as "all"
    filterYear = (v === parseInt(this.max)) ? 0 : v;
    yearVal.textContent = filterYear || 'All';
    buildMarkers();
  });
  // Default to "All" = slider at max
  slider.value = slider.max;

  // Severity buttons
  document.querySelectorAll('.sev-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var s = this.dataset.sev;
      filterSev[s] = !filterSev[s];
      this.classList.toggle('active', filterSev[s]);
      buildMarkers();
    });
  });

  // Cause filter
  document.getElementById('cause-filter').addEventListener('change', function() {
    filterCause = this.value;
    buildMarkers();
  });

  // Load data
  fetch('floods.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allData = data;
      document.getElementById('loading').style.display = 'none';

      // Populate cause dropdown
      var causes = [...new Set(data.map(function(e){ return e.cause; }))].filter(Boolean).sort();
      var sel = document.getElementById('cause-filter');
      causes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
      });

      buildMarkers();
    })
    .catch(function(err) {
      document.getElementById('loading').textContent = 'Failed to load data: ' + err;
    });
</script>
</body>
</html>
